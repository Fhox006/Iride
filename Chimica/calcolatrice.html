<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calcolatrice · Chimica</title>
<style>
/* ============================================================
   CALCOLATRICE — componente in stile CHIMICA
   Stesso set di variabili e stesse superfici del documento.
   Il blocco .calc-panel è autonomo: pronto da spostare dove serve.
   ============================================================ */
:root{
  --bg:#eae5db;
  --paper:#fdfcf9;
  --ink:#27241d;
  --muted:#71695c;
  --accent:#187a54;
  --accent-ink:#0e5c3e;
  --accent-soft:#e8f2ec;
  --warm:#c06a3e;
  --warm-soft:#f9ece7;
  --line:#ded7c7;
  --card:#ffffff;
  --card2:#fdfcf9;
  --panel:#fbf9f3;
  --hov:#f1ecdf;
  --soft2:#f4f0e4;
  --field:#f6f3ea;
  --line2:#e8e2d2;

  --sh1:0 2px 5px rgba(70,58,30,.07);
  --sh2:0 16px 44px rgba(70,58,30,.09);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,"Times New Roman",serif;
}
html[data-theme="dark"]{
  --bg:#131210;
  --paper:#1c1b17;
  --ink:#e7e2d6;
  --muted:#9a927f;
  --accent:#3fae7f;
  --accent-ink:#84d2ab;
  --accent-soft:#22362c;
  --warm:#d3946a;
  --warm-soft:#38291f;
  --line:#36332b;
  --card:#232119;
  --card2:#211f1a;
  --panel:#201e18;
  --hov:#2b2820;
  --soft2:#2a2721;
  --field:#25231c;
  --line2:#33302a;
  --sh1:0 2px 5px rgba(0,0,0,.25);
  --sh2:0 16px 44px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif)}
body.demo{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

#demoTheme{
  position:fixed;top:14px;right:14px;z-index:10;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:8px 14px;font-family:var(--sans);font-size:12.5px;cursor:pointer;
}
#demoTheme:hover{background:var(--hov)}

/* ---------- pannello calcolatrice ---------- */
.calc-panel{
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  padding:12px 13px;box-shadow:var(--sh1);
  font-family:var(--sans);width:min(310px,100%);
}
.cp-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}
.cp-title{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cp-status{font-size:11px;color:var(--accent-ink);white-space:nowrap}

.calc-screen{
  border:1px solid var(--line);border-radius:10px;background:var(--field);
  padding:9px 12px 8px;outline:none;transition:border-color .15s, background .15s;
}
.calc-screen:focus-within{border-color:var(--accent);background:var(--paper)}
#calcExpr{
  width:100%;border:none;background:transparent;outline:none;text-align:right;
  font-family:var(--sans);font-size:17px;font-weight:600;color:var(--ink);
  letter-spacing:.02em;padding:0;direction:ltr;
}
#calcExpr::placeholder{color:var(--muted);opacity:.55;font-weight:400}
.calc-preview{
  min-height:16px;margin-top:3px;text-align:right;font-size:12px;font-weight:700;
  color:var(--accent-ink);letter-spacing:.02em;
}
.calc-preview.err{color:var(--warm)}

.calc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.ckey{
  height:40px;border:1px solid var(--line);border-radius:10px;cursor:pointer;
  background:var(--card2);color:var(--ink);
  font-family:var(--sans);font-size:14.5px;font-weight:700;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s, border-color .12s, transform .06s;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.ckey:hover{background:var(--accent-soft);border-color:var(--accent)}
.ckey:active{transform:scale(.96)}
.ckey.op{background:var(--soft2);font-size:16px}
.ckey.fn{font-size:12.5px;font-weight:800;color:var(--accent-ink)}
.ckey.warn{background:var(--warm-soft);border-color:transparent;color:var(--warm);font-weight:800}
.ckey.warn:hover{background:var(--warm-soft);border-color:var(--warm)}
.ckey.eq{background:var(--accent);border-color:var(--accent);color:#fff;font-size:17px}
.ckey.eq:hover{filter:brightness(1.08)}
html[data-theme="dark"] .ckey.eq{color:#10241b}

.cp-hint{margin-top:9px;font-size:10.5px;line-height:1.5;color:var(--muted)}
</style>
</head>
<body class="demo">

<button id="demoTheme" type="button">Tema scuro</button>

<!-- ===================== CALCOLATRICE (componente) ===================== -->
<aside class="calc-panel" aria-label="Calcolatrice">
  <div class="cp-head">
    <span class="cp-title">Calcolatrice</span>
    <span class="cp-status" id="calcStatus"></span>
  </div>

  <div class="calc-screen" role="group" aria-label="Display calcolatrice">
    <input id="calcExpr" type="text" inputmode="none" autocomplete="off"
           placeholder="0" aria-label="Espressione" spellcheck="false">
    <div class="calc-preview" id="calcPreview" aria-live="polite"></div>
  </div>

  <div class="calc-keys" id="calcKeys">
    <button class="ckey warn" data-k="AC" aria-label="Cancella tutto">AC</button>
    <button class="ckey warn" data-k="BACK" aria-label="Cancella un carattere">&#9003;</button>
    <button class="ckey op" data-k="(">(</button>
    <button class="ckey op" data-k=")">)</button>
    <button class="ckey op" data-k="÷" aria-label="Divisione">&divide;</button>

    <button class="ckey" data-k="7">7</button>
    <button class="ckey" data-k="8">8</button>
    <button class="ckey" data-k="9">9</button>
    <button class="ckey fn" data-k="%" aria-label="Percentuale">%</button>
    <button class="ckey op" data-k="×" aria-label="Moltiplicazione">&times;</button>

    <button class="ckey" data-k="4">4</button>
    <button class="ckey" data-k="5">5</button>
    <button class="ckey" data-k="6">6</button>
    <button class="ckey fn" data-k="√" aria-label="Radice quadrata">&#8730;</button>
    <button class="ckey op" data-k="−" aria-label="Meno">&minus;</button>

    <button class="ckey" data-k="1">1</button>
    <button class="ckey" data-k="2">2</button>
    <button class="ckey" data-k="3">3</button>
    <button class="ckey fn" data-k="²" aria-label="Quadrato">x&sup2;</button>
    <button class="ckey op" data-k="+">+</button>

    <button class="ckey" data-k="0">0</button>
    <button class="ckey" data-k=",">,</button>
    <button class="ckey fn" data-k="Ans" aria-label="Ultimo risultato">Ans</button>
    <button class="ckey fn" data-k="^" aria-label="Potenza">x&#696;</button>
    <button class="ckey eq" data-k="=" aria-label="Uguale">=</button>
  </div>

  <p class="cp-hint">Scrivi anche da tastiera. Virgola o punto per i decimali, √ radice, x&#696; potenza, % divide per 100, Ans riprende l&rsquo;ultimo risultato.</p>
</aside>
<!-- =================== FINE CALCOLATRICE (componente) =================== -->

<script>
(function(){
"use strict";

/* =====================================================================
   MOTORE DI CALCOLO — tokenizer + parser a discesa ricorsiva.
   Nessun eval: l'espressione è analizzata token per token.
   Supporto: + − × ÷ ^ ( ) % √ π Ans, decimali con , o .
   ===================================================================== */

function tokenize(src){
  var toks = [], i = 0;
  while(i < src.length){
    var c = src[i];
    if(c === " " || c === "\t"){ i++; continue; }
    if(/[0-9]/.test(c) || c === "." || c === ","){
      var num = "", dot = false;
      while(i < src.length && (/[0-9]/.test(src[i]) || src[i] === "." || src[i] === ",")){
        if(src[i] === "." || src[i] === ","){
          if(dot){ throw new Error("decimale"); }
          dot = true; num += ".";
        } else { num += src[i]; }
        i++;
      }
      toks.push({ t:"num", v:parseFloat(num) });
      continue;
    }
    if(c === "+"){ toks.push({ t:"+", v:"+" }); i++; continue; }
    if(c === "-" || c === "\u2212"){ toks.push({ t:"-", v:"-" }); i++; continue; }
    if(c === "*" || c === "×" || c === "\u00B7" || c === "\u2219"){ toks.push({ t:"*", v:"\u00D7" }); i++; continue; }
    if(c === "/" || c === ":" || c === "÷"){ toks.push({ t:"/", v:"\u00F7" }); i++; continue; }
    if(c === "^"){ toks.push({ t:"^", v:"^" }); i++; continue; }
    if(c === "(" || c === "["){ toks.push({ t:"(", v:"(" }); i++; continue; }
    if(c === ")" || c === "]"){ toks.push({ t:")", v:")" }); i++; continue; }
    if(c === "%"){ toks.push({ t:"%", v:"%" }); i++; continue; }
    if(c === "√" || c === "\u221A"){ toks.push({ t:"sqrt", v:"√" }); i++; continue; }
    if(src.startsWith("Ans", i)){ toks.push({ t:"ans", v:"Ans" }); i += 3; continue; }
    if(src.startsWith("pi", i) || src.startsWith("π", i)){
      toks.push({ t:"pi", v:"π" }); i += (src[i] === "π" ? 1 : 2); continue;
    }
    throw new Error("carattere");
  }
  return toks;
}

function makeParser(toks, ans){
  var pos = 0;
  function peek(){ return toks[pos] || null; }
  function next(){ return toks[pos++]; }

  /* expr := term ((+|-) term)* */
  function expr(){
    var v = term();
    while(peek() && (peek().t === "+" || peek().t === "-")){
      var op = next().t;
      var r = term();
      v = (op === "+") ? v + r : v - r;
    }
    return v;
  }

  /* term := unary ((*|/|implicito) unary)*  */
  function term(){
    var v = unary();
    for(;;){
      var p = peek();
      if(p && (p.t === "*" || p.t === "/")){
        next();
        var r = unary();
        if(p.t === "/"){
          if(r === 0){ throw new Error("divisione"); }
          v = v / r;
        } else { v = v * r; }
      } else if(p && (p.t === "num" || p.t === "(" || p.t === "sqrt" || p.t === "ans" || p.t === "pi")){
        /* moltiplicazione implicita: 2(3+1), 2√9, 3Ans */
        v = v * unary();
      } else { break; }
    }
    return v;
  }

  /* unary := (+|-)* power  — il segno si applica dopo la potenza */
  function unary(){
    var neg = false;
    while(peek() && (peek().t === "+" || peek().t === "-")){
      if(next().t === "-"){ neg = !neg; }
    }
    var v = power();
    return neg ? -v : v;
  }

  /* power := postfix (^ unary)?  — associativa a destra */
  function power(){
    var base = postfix();
    if(peek() && peek().t === "^"){
      next();
      return Math.pow(base, unary());
    }
    return base;
  }

  /* postfix := primary %* */
  function postfix(){
    var v = primary();
    while(peek() && peek().t === "%"){
      next();
      v = v / 100;
    }
    return v;
  }

  function primary(){
    var p = peek();
    if(!p){ throw new Error("fine"); }
    if(p.t === "num"){ next(); return p.v; }
    if(p.t === "ans"){ next(); return ans; }
    if(p.t === "pi"){ next(); return Math.PI; }
    if(p.t === "("){
      next();
      var v = expr();
      if(!peek() || peek().t !== ")"){ throw new Error("parentesi"); }
      next();
      return v;
    }
    if(p.t === "sqrt"){
      next();
      var r = power();
      if(r < 0){ throw new Error("radice"); }
      return Math.sqrt(r);
    }
    throw new Error("token");
  }

  return {
    run: function(){
      var v = expr();
      if(pos !== toks.length){ throw new Error("avanzo"); }
      if(typeof v !== "number" || isNaN(v)){ throw new Error("nan"); }
      return v;
    }
  };
}

/* Formatta il risultato in stile italiano: virgola decimale,
   notazione scientifica solo oltre le soglie leggibili. */
function fmt(x){
  if(!isFinite(x)){ return null; }
  if(x !== 0 && (Math.abs(x) >= 1e15 || Math.abs(x) < 1e-9)){
    return x.toExponential(6).replace(/\.?0+e/, "e").replace(".", ",");
  }
  var s = String(parseFloat(x.toPrecision(12)));
  return s.replace(".", ",");
}

/* =====================================================================
   INTERFACCIA
   ===================================================================== */

var $expr = document.getElementById("calcExpr");
var $prev = document.getElementById("calcPreview");
var $stat = document.getElementById("calcStatus");

var Ans = 0;
var justEvaluated = false;

function evaluate(src){
  var s = (src == null ? $expr.value : src).trim();
  if(!s){ return null; }
  try{
    var toks = tokenize(s);
    if(!toks.length){ return null; }
    return makeParser(toks, Ans).run();
  } catch(e){
    return undefined; /* errore di sintassi o di dominio */
  }
}

function renderPreview(){
  var v = evaluate();
  $prev.classList.remove("err");
  if(v === null){
    $prev.textContent = "";
    $stat.textContent = "";
    return;
  }
  if(v === undefined){
    $prev.textContent = "Espressione non valida";
    $prev.classList.add("err");
    $stat.textContent = "";
    return;
  }
  var out = fmt(v);
  if(out === null){
    $prev.textContent = "Fuori intervallo";
    $prev.classList.add("err");
    return;
  }
  $prev.textContent = "= " + out;
  $stat.textContent = "";
}

function doEvaluate(commit){
  var v = evaluate();
  if(v === null){ return; }
  if(v === undefined || fmt(v) === null){
    $prev.classList.add("err");
    $prev.textContent = (v === undefined) ? "Espressione non valida" : "Fuori intervallo";
    $stat.textContent = "";
    return;
  }
  Ans = v;
  $expr.value = fmt(v);
  $prev.textContent = commit ? "" : "= " + fmt(v);
  $stat.textContent = "salvato in Ans";
  justEvaluated = true;
  placeCursorEnd();
}

function clearAll(){
  $expr.value = "";
  $prev.textContent = "";
  $prev.classList.remove("err");
  $stat.textContent = "";
  justEvaluated = false;
}

function insert(text){
  var start = $expr.selectionStart, end = $expr.selectionEnd;
  if(justEvaluated){
    var isOp = /^[+\-\u2212×÷^%]/.test(text);
    if(!isOp){ clearAll(); start = end = 0; }
    else { justEvaluated = false; }
  } else { justEvaluated = false; }
  var v = $expr.value;
  $expr.value = v.slice(0, start) + text + v.slice(end);
  var np = start + text.length;
  $expr.focus();
  try{ $expr.setSelectionRange(np, np); }catch(e){}
  renderPreview();
}

function backspace(){
  if(justEvaluated){ clearAll(); return; }
  var start = $expr.selectionStart, end = $expr.selectionEnd;
  var v = $expr.value;
  if(start === end){
    if(start === 0){ return; }
    $expr.value = v.slice(0, start - 1) + v.slice(start);
    start--;
  } else {
    $expr.value = v.slice(0, start) + v.slice(end);
  }
  $expr.focus();
  try{ $expr.setSelectionRange(start, start); }catch(e){}
  renderPreview();
}

function placeCursorEnd(){
  var n = $expr.value.length;
  try{ $expr.setSelectionRange(n, n); }catch(e){}
}

document.getElementById("calcKeys").addEventListener("click", function(e){
  var b = e.target.closest(".ckey");
  if(!b){ return; }
  var k = b.getAttribute("data-k");
  if(k === "AC"){ clearAll(); return; }
  if(k === "BACK"){ backspace(); return; }
  if(k === "="){ doEvaluate(true); return; }
  if(k === "^"){ insert("^"); return; }
  if(k === "²"){ insert("^(2)"); return; }
  insert(k);
});

$expr.addEventListener("input", function(){
  justEvaluated = false;
  renderPreview();
});

$expr.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === "="){
    e.preventDefault();
    doEvaluate(true);
  } else if(e.key === "Escape"){
    e.preventDefault();
    clearAll();
  }
});

renderPreview();

/* Solo per la pagina dimostrativa: cambio tema. */
document.getElementById("demoTheme").addEventListener("click", function(){
  var root = document.documentElement;
  var dark = root.getAttribute("data-theme") === "dark";
  root.setAttribute("data-theme", dark ? "" : "dark");
  this.textContent = dark ? "Tema scuro" : "Tema chiaro";
});
})();
</script>
</body>
</html>
