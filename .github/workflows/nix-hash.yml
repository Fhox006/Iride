name: Update Nix hash
on:
  push:
    branches: [main]
    paths:
      - package-lock.json
      - package.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nix-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Compute npmDepsHash and version
        continue-on-error: true
        run: |
          HASH=$(FORCE_GIT_DEPS=1 nix run nixpkgs#prefetch-npm-deps -- package-lock.json | tail -n 1)
          case "$HASH" in sha256-*) ;; *) echo "bad hash: $HASH"; exit 1;; esac
          VERSION=$(jq -r .version package.json)
          sed -i "s|npmDepsHash = \"[^\"]*\";|npmDepsHash = \"${HASH}\";|" flake.nix
          sed -i "s|version = \"[0-9][0-9.]*\";|version = \"${VERSION}\";|" flake.nix
      - name: Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet flake.nix || (git commit -m "flake: update npmDepsHash and version" flake.nix && git push)
      - name: Check the package builds
        continue-on-error: true
        run: nix build .#default --no-link
