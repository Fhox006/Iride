name: Iride Android Screenshot

on:
  workflow_dispatch:
  push:
    branches: [codex/iride-cloud-screenshot]
    paths:
      - .github/workflows/android-screenshot.yml
      - .github/scripts/capture-android-screenshot.sh

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure installed Android tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "::error::sdkmanager not found under $sdk_root/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$sdkmanager_path")" "$sdk_root/platform-tools" "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "Using sdkmanager: $sdkmanager_path"

      - name: Download verified official Iride APK
        run: |
          mkdir -p artifacts/diagnostics
          curl --fail --location --retry 3 --output artifacts/Iride.apk \
            https://github.com/Fhox006/Iride/releases/download/v0.1.0-alpha34/Iride.apk
          echo 'f6ab42705fcf8752a03d573b25522839b8cdb354d5e3d47cd31e8feaac73acdf  artifacts/Iride.apk' | sha256sum --check
          echo 'Official release v0.1.0-alpha34; not a build of the checkout.' > artifacts/diagnostics/apk-source.txt

      - name: Prepare capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/iride-capture.sh" <<'BASH'
          set -euo pipefail
          trap 'adb logcat -d > artifacts/diagnostics/logcat.txt 2>&1 || true' EXIT
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$aapt_path" dump badging artifacts/Iride.apk > artifacts/diagnostics/apk-badging.txt
          package="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" artifacts/diagnostics/apk-badging.txt)"
          activity="$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" artifacts/diagnostics/apk-badging.txt)"
          test -n "$package"
          test -n "$activity"
          adb install -r artifacts/Iride.apk
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb logcat -c
          adb shell am start -W -n "$package/$activity" | tee artifacts/diagnostics/launch.txt
          grep -q 'Status: ok' artifacts/diagnostics/launch.txt
          sleep 20
          adb shell pidof "$package" > artifacts/diagnostics/pid.txt
          adb shell dumpsys activity activities > artifacts/diagnostics/activities.txt
          grep -E '(mResumedActivity|topResumedActivity)' artifacts/diagnostics/activities.txt | grep -F "$package/" | grep -v ':crash/'
          adb exec-out screencap -p > artifacts/iride-initial.png
          file --mime-type artifacts/iride-initial.png | grep -q 'image/png'
          adb shell uiautomator dump /sdcard/iride-window.xml
          adb pull /sdcard/iride-window.xml artifacts/diagnostics/window.xml
          BASH

      - name: Enable KVM access
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Iride and capture real display
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/iride-capture.sh"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: iride-screenshot-${{ github.run_id }}
          path: artifacts/iride-initial.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iride-diagnostics-${{ github.run_id }}
          path: artifacts/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
