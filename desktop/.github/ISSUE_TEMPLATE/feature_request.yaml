name: Feature Request / Suggestion
description: Suggest an idea or feature for the desktop app
title: "[SUGGESTION]: "
labels: ["Suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > Feature suggestions are for the **official desktop application** only.

  - type: checkboxes
    id: terms
    attributes:
      label: Desktop Confirmation
      options:
        - label: I confirm this suggestion is for the desktop app (not mobile)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: It would be great if [...]
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any mockups, screenshots, or other context here.
