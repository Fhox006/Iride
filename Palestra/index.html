<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Palestra</title>
<style>
/* ============================================================
   PALESTRA — documento di studio interattivo
   Tipografia: 10pt · interlinea 1.30 · margini 28/26mm
   Spazio blocchi 0.70em · peso 500  (pannello ingranaggio)
   ============================================================ */
:root{
  --fs: 10pt;
  --lh: 1.30;
  --mx: 28mm;
  --my: 26mm;
  --gap: 0.70em;
  --fw: 500;
  --pagew: 240mm;

  --bg:#eae5db;
  --paper:#fdfcf9;
  --ink:#27241d;
  --muted:#71695c;
  --accent:#cd6b21;
  --accent-ink:#9a4c12;
  --accent-soft:#faeadb;
  --accent2:#eb984e;
  --warm:#b23a2f;
  --warm-soft:#f9e5e1;
  --line:#ded7c7;
  --card:#ffffff;
  --card2:#fdfcf9;
  --panel:#fbf9f3;
  --hov:#f1ecdf;
  --soft2:#f4f0e4;
  --rowalt:#faf8f1;
  --field:#f6f3ea;
  --line2:#e8e2d2;
  --hlbg:#ffe89a;
  --ulbg:#ffe14d;
  --rule:#e3ead9;

  --fig-line:#948b76;
  --fig-ink:#3d382c;
  --fig-node:#ffffff;

  --sh1:0 2px 5px rgba(70,58,30,.07);
  --sh2:0 16px 44px rgba(70,58,30,.09);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,"Times New Roman",serif;
}
html[data-theme="dark"]{
  --bg:#131210;
  --paper:#1c1b17;
  --ink:#e7e2d6;
  --muted:#9a927f;
  --accent:#ef9a55;
  --accent-ink:#ffc694;
  --accent-soft:#3b291a;
  --accent2:#f7b06e;
  --warm:#e08379;
  --warm-soft:#402320;
  --line:#36332b;
  --card:#232119;
  --card2:#211f1a;
  --panel:#201e18;
  --hov:#2b2820;
  --soft2:#2a2721;
  --rowalt:#22201a;
  --field:#25231c;
  --line2:#33302a;
  --hlbg:#66551c;
  --ulbg:#6e5a10;
  --rule:#2c2b24;
  --fig-line:#77705f;
  --fig-ink:#d8d2c4;
  --fig-node:#26241e;
  --sh1:0 2px 5px rgba(0,0,0,.25);
  --sh2:0 16px 44px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif)}
::selection{background:var(--hlbg)}

/* ---------- barra superiore ---------- */
#progress{position:fixed;left:0;top:0;height:3px;width:0;z-index:200;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
header.app{
  position:sticky;top:0;z-index:150;
  display:flex;align-items:center;gap:8px;
  padding:9px clamp(10px,3vw,26px);
  background:rgba(253,252,249,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
html[data-theme="dark"] header.app{background:rgba(28,27,23,.94)}
.ibtn{
  width:38px;height:38px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  border-radius:10px;border:none;background:transparent;cursor:pointer;
  color:var(--ink);
}
.ibtn:hover{background:var(--hov)}
.ico{width:18px;height:18px;display:block}
.brand{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:.03em;white-space:nowrap}
.brand em{color:var(--accent);font-style:normal}
.searchwrap{flex:1;min-width:90px;max-width:520px;position:relative;margin-left:auto}
.searchwrap input{
  width:100%;padding:8px 12px 8px 36px;border:1px solid var(--line);border-radius:999px;
  background:var(--field);font-family:var(--sans);font-size:13.5px;color:var(--ink);outline:none;
}
.searchwrap input:focus{border-color:var(--accent);background:var(--paper)}
.sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55;width:16px;height:16px;pointer-events:none}
#results{
  display:none;position:absolute;top:112%;left:0;right:0;z-index:180;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 12px 34px rgba(0,0,0,.22);max-height:min(58vh,420px);overflow-y:auto;
}
#results.on{display:block}
.sr-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--accent-soft)}
.sr-kick{font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sr-tit{font-family:var(--sans);font-size:13.5px;font-weight:700;margin:1px 0}
.sr-snip{font-size:12px;color:var(--muted);line-height:1.45}
.sr-snip b{color:var(--accent-ink);background:var(--hlbg);border-radius:3px;padding:0 1px}
.sr-empty{padding:14px;color:var(--muted);font-family:var(--sans);font-size:13px;text-align:center}
#themeBtn .ico-sun{display:none}
html[data-theme="dark"] #themeBtn .ico-sun{display:block}
html[data-theme="dark"] #themeBtn .ico-moon{display:none}

/* ---------- pannello impostazioni tipografiche ---------- */
#settings{
  display:none;position:fixed;top:62px;right:10px;z-index:190;width:min(350px,calc(100vw - 20px));
  background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  box-shadow:var(--sh2);
}
#settings.open{display:block}
#settings h4{margin:0 0 2px;font-family:var(--sans);font-size:14px}
#settings .hint{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.set-row{display:grid;grid-template-columns:118px 1fr 74px;align-items:center;gap:8px;margin:9px 0}
.set-row label{font-family:var(--sans);font-size:12.5px;color:var(--ink)}
.set-row output{font-family:var(--sans);font-size:11.5px;color:var(--accent-ink);text-align:right;font-weight:600}
.set-row input[type=range]{width:100%;accent-color:var(--accent)}
.set-foot{display:flex;justify-content:flex-end;margin-top:10px}
.prog-sep{height:1px;background:var(--line2);margin:16px -18px 14px}
.btn-mini{border:1px solid var(--line);background:var(--soft2);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);color:var(--ink)}
.btn-mini:hover{background:var(--accent-soft);border-color:var(--accent)}

/* ---------- cassetto indice ---------- */
#backdrop{position:fixed;inset:0;background:rgba(20,16,8,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:240}
#backdrop.show{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(320px,88vw);z-index:250;
  background:var(--paper);transform:translateX(-103%);transition:transform .28s ease;
  display:flex;flex-direction:column;box-shadow:14px 0 40px rgba(0,0,0,.25);
}
#drawer.open{transform:translateX(0)}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-head strong{font-family:var(--sans);font-size:15px}
.dr-nav{overflow-y:auto;padding:10px 10px 30px}
.ch-group{margin-bottom:6px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--panel)}
.ch-head{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:11px 13px;border:none;background:transparent;cursor:pointer;
}
.ch-num{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--accent-ink);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.ch-name{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.25;text-align:left}
.ch-arrow{margin-left:auto;transition:transform .2s;color:var(--muted)}
.ch-group.open .ch-arrow{transform:rotate(90deg)}
.ch-pages{display:none;padding:2px 8px 10px}
.ch-group.open .ch-pages{display:block}
.ch-pages a{
  display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);
  font-family:var(--sans);font-size:13px;padding:6px 8px;border-radius:8px;line-height:1.35;
}
.ch-pages a:hover{background:var(--hov)}
.ch-pages a.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.pg-no{font-size:11px;font-weight:700;color:var(--accent-ink);min-width:24px}
.ch-pages a.sub-link{padding-left:34px}
.ch-pages a.home-link{font-weight:700}
.ch-pages a .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-pages a.isdone:not(.active) .lbl{color:var(--muted)}
.toc-chk{width:15px;height:15px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;margin-top:2px;
  font-size:9px;line-height:1;color:transparent;background:transparent;position:relative;cursor:pointer;
  transition:background .18s,border-color .18s,color .18s}
.toc-chk::after{content:"";position:absolute;inset:-8px;border-radius:50%}
.ch-pages a.isdone .toc-chk{background:var(--accent);border-color:var(--accent);color:#fff}
.ch-head > div{min-width:0}
.ch-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-comp{margin-left:auto;font-family:var(--sans);font-size:10.5px;font-weight:800;color:var(--muted);
  white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.ch-comp + .ch-arrow{margin-left:0}
.ch-group.complete{background:var(--accent-soft);border-color:var(--accent)}
.ch-group.complete .ch-num,.ch-group.complete .ch-name,.ch-group.complete .ch-comp{color:var(--accent-ink)}
.ul-item{display:flex;align-items:baseline;gap:8px;padding:7px 10px;border-bottom:1px dashed var(--line2);cursor:pointer}
.ul-item:last-child{border-bottom:none}
.ul-item:hover{background:var(--hov)}
.ul-txt{flex:1;font-family:var(--sans);font-size:12.5px;color:var(--ink);line-height:1.4}
.ul-page{font-family:var(--sans);font-size:10px;color:var(--muted);white-space:nowrap}
.ul-del{border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:0 2px;opacity:0;transition:opacity .15s}
.ul-item:hover .ul-del{opacity:1}
.ul-del:hover{color:var(--warm)}
.ul-empty{font-family:var(--sans);font-size:12px;color:var(--muted);padding:6px 8px;line-height:1.5}
#ulineGroup .ch-arrow{display:none}
#ulineGroup .ch-head{padding:10px 13px}
#ulineGroup .ch-name{font-weight:600;font-size:12.5px;color:var(--muted)}

/* ---------- argomento completato (fuori dal foglio) ---------- */
.done-row{max-width:var(--pagew);margin:16px auto 0;display:flex;justify-content:center;padding:0 8px}
.done-ring{display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  -webkit-user-select:none;user-select:none;position:relative;
  font-family:var(--sans);font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:7px 14px;border-radius:999px;transition:color .2s,background .2s}
.done-ring:hover{background:var(--hov)}
.done-ring input{position:absolute;width:1px;height:1px;opacity:0}
.done-ring .ring{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);
  background:var(--paper);display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;line-height:1;
  transition:border-color .2s,background .25s}
.done-ring .ring::before{content:"\2713";opacity:0;transform:scale(.4);transition:opacity .18s,transform .18s}
.done-ring:hover .ring{border-color:var(--accent)}
.done-row.on .done-ring{color:var(--accent-ink)}
.done-row.on .ring{background:var(--accent);border-color:var(--accent)}
.done-row.on .ring::before{opacity:1;transform:scale(1)}

/* ---------- lettore ---------- */
main.reader{padding:22px 14px 120px}
.sheet{
  max-width:var(--pagew);margin:0 auto;background:var(--paper);
  border:1px solid var(--line2);border-radius:4px;
  box-shadow:var(--sh1),var(--sh2);
  padding:var(--my) var(--mx);
  font-size:var(--fs);line-height:var(--lh);font-weight:var(--fw);
}
.kicker{font-family:var(--sans);font-size:.72em;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-ink);margin-bottom:.7em;font-weight:700}
h2.pt-title{font-family:var(--serif);font-size:1.9em;line-height:1.15;margin:0 0 .8em;font-weight:800;letter-spacing:-.015em}
h3{font-size:1.3em;line-height:1.25;margin:1.6em 0 .55em;font-weight:750;letter-spacing:-.01em}
p{margin:0 0 var(--gap)}
strong{font-weight:700}
ul.dots{margin:0 0 var(--gap);padding-left:1.35em}
ul.dots li{margin:.32em 0}
.lead{font-style:italic;color:var(--muted);font-size:1.07em}
.src{font-size:.86em;color:var(--muted);font-style:italic;margin:.35em 0 0}
.pt-body > p:first-of-type:not(.lead)::first-letter{
  float:left;font-size:3.05em;line-height:.82;padding:3px 7px 0 0;
  color:var(--accent-ink);font-weight:750;
}

/* ---------- box unico: Definizione ---------- */
.box{border:1px solid #f0cfad;border-radius:12px;padding:12px 15px;margin:1em 0;background:var(--accent-soft)}
html[data-theme="dark"] .box{border-color:#4a3423}
.box p:last-child{margin-bottom:0}
.box-tag{font-family:var(--sans);font-size:.68em;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-ink);margin-bottom:.45em}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:.7em;margin:1em 0}
.cols2 .box{margin:0}

/* ---------- timeline ---------- */
ol.timeline{list-style:none;margin:0 0 var(--gap);padding:0 0 0 26px;border-left:2px solid var(--line)}
ol.timeline li{position:relative;margin:0 0 .75em;padding-left:14px}
ol.timeline li::before{content:"";position:absolute;left:-33px;top:.42em;width:9px;height:9px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-y{font-family:var(--sans);font-weight:800;color:var(--accent-ink);margin-right:4px}

/* elenco numerato */
ol.steps{list-style:none;counter-reset:s;margin:0 0 var(--gap);padding:0}
ol.steps li{position:relative;counter-increment:s;padding-left:36px;margin:.4em 0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.02em;width:23px;height:23px;
  border-radius:50%;background:var(--accent);color:#fff;font-family:var(--sans);
  font-size:.72em;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ---------- tabelle ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:.93em;margin:.5em 0 1em;background:var(--card)}
table.tbl th{background:var(--accent-soft);color:var(--accent-ink);text-align:left;font-weight:800}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
table.tbl tr:nth-child(even) td{background:var(--rowalt)}

/* barre percentuali */
.bar-row{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:9px;margin:7px 0;font-size:.95em}
.bar-row .lbl{font-family:var(--sans);font-size:.85em;font-weight:700;color:var(--ink)}
.bar-row .bar{height:13px;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar-row .val{font-family:var(--sans);font-size:.82em;font-weight:700;color:var(--accent-ink);text-align:right}

/* equazioni */
.eq{text-align:center;margin:1em 0;font-size:1.08em;letter-spacing:.02em}
.eq sub,.eq sup{font-size:.66em}
.eq .rx{color:var(--accent-ink);font-weight:750}

/* figure */
.fig{margin:1.1em 0;text-align:center}
.fig + .fig{margin-top:2.6em}
.fig svg{width:100%;height:auto;max-width:560px}
.fig figcaption{font-size:.84em;color:var(--muted);font-style:italic;margin-top:.4em}
.fig .nd{fill:var(--fig-node);stroke:var(--fig-line);stroke-width:1.6}
.fig .nd-acc{stroke:var(--accent);fill:var(--accent-soft)}
.fig .nd-bad{stroke:var(--warm);fill:var(--warm-soft)}
.fig text{font-family:var(--sans);font-size:16.5px;fill:var(--fig-ink);font-weight:600}
.fig .small{font-size:12.5px;fill:var(--muted);font-weight:500}
.fig .fl{stroke:var(--fig-line);stroke-width:2;fill:none}
.fig .fg{stroke:var(--accent)}
.fig .fo{stroke:var(--warm)}
.fig .mk-n{fill:var(--fig-line)}
.fig .mk-a{fill:var(--accent)}
.fig .mk-o{fill:var(--warm)}

/* ---------- tooltip personaggi ---------- */
.who{border-bottom:1px dotted var(--accent);cursor:help;font-weight:650}
#whoTip{
  display:none;position:absolute;z-index:300;width:min(340px,86vw);
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;box-shadow:var(--sh2);
  font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--ink);
}
.wt-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.wt-name{font-weight:800}
.wt-years{color:var(--muted);font-size:10.5px;white-space:nowrap}
.wt-t{margin:0}

/* ---------- verifica veloce ---------- */
.checkin{border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin:1.15em 0}
.ck-tag{font-family:var(--sans);font-size:.66em;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.4em}
.ck-q{margin:0 0 .55em}
.ck-btns{display:flex;flex-wrap:wrap;gap:8px}
.ck-btns button{border:1px solid var(--line);background:var(--card2);color:var(--ink);
  border-radius:999px;padding:6px 14px;font-family:var(--sans);font-size:12.5px;cursor:pointer}
.ck-btns button:hover:not(:disabled){border-color:var(--accent)}
.ck-btns button.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.ck-btns button.ko{border-color:var(--warm);background:var(--warm-soft)}
.ck-btns button:disabled{cursor:default;opacity:.9}
.ck-e{display:none;margin:.6em 0 0;font-size:.95em;color:var(--muted);font-style:italic}
.checkin.answered .ck-e{display:block}

/* ---------- esempio svolto ---------- */
.svolg{position:relative;margin:1.1em 0;padding:14px 16px 12px 3em;
  border:1px solid var(--line);border-radius:12px;background:var(--card)}
.sv-tag{position:absolute;top:-8px;left:14px;background:var(--paper);padding:0 8px;
  font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.sv-title{font-weight:800;font-size:1.05em;margin:0 0 .2em}
.sv-traccia{font-style:italic;color:var(--muted);margin:0 0 .6em;padding-bottom:.5em;
  border-bottom:1px solid var(--rule)}
.svolg ol.hand{list-style:none;counter-reset:h;margin:0;padding:0;font-style:italic}
.svolg ol.hand li{counter-increment:h;position:relative;padding:.32em 0 .42em 1.7em;
  border-bottom:1px solid var(--rule)}
.svolg ol.hand li:last-child{border-bottom:none}
.svolg ol.hand li::before{content:counter(h) ".";position:absolute;left:0;top:.32em;
  font-style:normal;font-weight:750;color:var(--accent-ink)}
.ris{display:inline-block;margin-top:.6em;padding:1px 12px;border:1.6px solid var(--accent);
  border-radius:9px;font-style:normal;font-weight:750;color:var(--accent-ink);transform:rotate(-.7deg)}

/* ---------- riepilogo ---------- */
.recap-intro{font-style:italic;color:var(--muted)}

/* piè di pagina interno */
.fine{margin-top:2.4em;padding-top:1em;border-top:1px solid var(--line);
  color:var(--muted);font-size:.82em;font-style:italic}

/* ---------- navigazione pagine nell'header ---------- */
.pgnav{
  display:flex;align-items:center;gap:2px;flex:0 0 auto;
  padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--field);
}
.pgnav .ibtn{width:30px;height:30px;border-radius:9px}
.pgnav-lab{
  min-width:0;max-width:230px;padding:0 8px;
  font-family:var(--sans);font-size:12px;font-weight:800;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
}
.pgnav-lab em{color:var(--accent-ink);font-style:normal}
.hdr-sep{width:1px;height:22px;background:var(--line2);flex:0 0 auto;margin:0 4px}
.ibtn:disabled{opacity:.32;cursor:default}
.ibtn:disabled:hover{background:transparent}

/* ---------- apertura (indice) ---------- */
.hero{padding:1.2em 0 .4em}
.hero-kicker{font-family:var(--sans);font-size:.72em;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:800;margin-bottom:.8em}
.hero h1{font-size:2.9em;line-height:1.05;margin:0 0 .25em;font-weight:850;letter-spacing:-.02em}
.hero .sub{font-size:1.1em;font-style:italic;color:var(--muted)}
.home-ch{border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:1.2em 0;background:var(--panel)}
.home-ch h3{margin:.1em 0 .5em;font-size:1.25em}
.home-ch .ch-meta{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:800}
.home-ch ul{list-style:none;margin:0;padding:0}
.home-ch li{font-family:var(--sans);font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line2)}
.home-ch li:last-child{border-bottom:none}
.home-ch li .n{color:var(--accent-ink);font-weight:800;margin-right:8px;font-size:11.5px}
.home-ch li.sub-li{padding-left:26px;font-weight:600}

/* ---------- verifica (quiz) ---------- */
.badge-theory,.badge-exercise{display:inline-block;font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 10px;border-radius:999px;margin-bottom:.55em}
.badge-theory{background:var(--accent-soft);color:var(--accent-ink)}
.badge-exercise{background:var(--warm-soft);color:var(--warm)}
.q-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 .9em;background:var(--card)}
.q-card.ok{border-color:var(--accent)}
.q-card.ko{border-color:var(--warm)}
.q-text{margin:0 0 .55em;font-weight:750}
.opt{
  display:flex;width:100%;text-align:left;gap:9px;align-items:baseline;
  padding:9px 13px;margin:6px 0;border:1px solid var(--line);border-radius:10px;
  background:var(--card2);font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;line-height:1.4;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .ol{font-weight:800;color:var(--accent-ink);font-size:12px}
.opt.correct{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--warm);background:var(--warm-soft)}
.opt:disabled{cursor:default;opacity:.92}
.inp-row{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.inp-row input{
  width:150px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  font-family:var(--sans);font-size:14px;outline:none;background:var(--card2);color:var(--ink);
}
.inp-row input:focus{border-color:var(--accent)}
.inp-row input:disabled{background:var(--soft2)}
.inp-row .unit{font-family:var(--sans);font-size:12px;color:var(--muted)}
.chk-btn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);
  border-radius:9px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.chk-btn:hover:not(:disabled){filter:brightness(.97)}
.chk-btn:disabled{opacity:.45;cursor:default}
.expl{display:none;margin-top:.55em;font-size:.95em;font-style:italic;color:var(--muted);line-height:1.5}
.expl .v{font-style:normal;font-weight:750;color:var(--accent-ink)}
.q-card.answered .expl{display:block}
.reset-row{text-align:center;margin-top:1.4em}
.score-panel{border:2px solid var(--accent);border-radius:16px;background:var(--accent-soft);
  padding:18px;text-align:center;margin-top:1.2em}
.score-big{font-family:var(--sans);font-size:30px;font-weight:850;color:var(--accent-ink)}
.score-msg{font-family:var(--sans);font-size:13px;color:var(--ink);margin-top:4px;line-height:1.5}

/* blocchi esercizi inline */
.exblock{border:1px solid var(--line);border-radius:14px;margin:1.6em 0 0;background:var(--card);overflow:hidden}
.exb-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--panel);border:none;cursor:pointer;font-family:var(--sans)}
.exb-title{font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--ink)}
.exb-count{font-size:11px;color:var(--muted)}
.exb-arrow{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:11px}
.exblock.open .exb-arrow{transform:rotate(180deg)}
.exb-body{display:none;padding:2px 15px 14px;border-top:1px solid var(--line2)}
.exblock.open .exb-body{display:block}
.exb-part{font-family:var(--sans);font-size:.66em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin:14px 0 2px}
.exb-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2);font-family:var(--sans);font-size:12px;color:var(--muted)}

/* sottolineature */
mark.uline{background:var(--ulbg);color:inherit;border-radius:3px;padding:0 2px;cursor:pointer}
mark.uline.first{outline:2px solid var(--accent2);border-radius:2px}


.fig .pt{fill:var(--accent)}
.fig .ptw{fill:var(--warm)}
.fig .orb{fill:var(--accent);opacity:.18;stroke:var(--accent);stroke-width:1.4}
.fig .orbw{fill:var(--warm);opacity:.25;stroke:var(--warm);stroke-width:1.4;stroke-dasharray:5 4}

/* evidenziazione ricerca */
mark.hl{background:var(--hlbg);border-radius:3px;padding:0 1px}
mark.hl.first{outline:2px solid var(--warm)}

/* ---------- lettore vocale (frosted, largo quanto il foglio) ---------- */
#ttsBar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:260;
  width:min(240mm,calc(100vw - 24px));
  background:rgba(253,252,249,.72);
  backdrop-filter:blur(16px) saturate(1.35);
  -webkit-backdrop-filter:blur(16px) saturate(1.35);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 28px rgba(70,58,30,.16);
  padding:5px 8px;display:none;flex-direction:column;gap:4px;
}
html[data-theme="dark"] #ttsBar{background:rgba(28,27,23,.72)}
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){
  #ttsBar{background:var(--paper)}
}
#ttsBar.on{display:flex}
.tts-row{display:flex;align-items:center;gap:4px}
.tbtn{
  width:32px;height:32px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  border-radius:9px;border:none;background:transparent;cursor:pointer;color:var(--ink);
}
.tbtn:hover{background:var(--hov)}
.tbtn .ico{width:15px;height:15px}
.tbtn.acc{color:var(--accent-ink)}
#ttsPlay .ico-pause{display:none}
#ttsPlay.playing .ico-pause{display:block}
#ttsPlay.playing .ico-play{display:none}
#ttsProg{flex:1;height:6px;min-width:50px;border-radius:4px;background:rgba(127,116,92,.18);
  cursor:pointer;position:relative;overflow:hidden;margin:0 4px}
#ttsFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
#ttsCount{font-family:var(--sans);font-size:10.5px;font-weight:700;color:var(--muted);
  white-space:nowrap;padding-right:2px;font-variant-numeric:tabular-nums}
#ttsMin svg{transition:transform .25s ease;color:var(--accent-ink)}
#ttsBar.open #ttsMin svg{transform:rotate(180deg)}
.tts-extra{display:none;padding:7px 6px 5px;margin-top:2px;border-top:1px dashed var(--line2);flex-wrap:wrap}
#ttsBar.open .tts-extra{display:flex;gap:14px;align-items:center}
#ttsBar.open .tbtn{width:30px;height:30px}
.tts-lab{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:11.5px;
  font-weight:600;color:var(--muted);white-space:nowrap}
.tts-lab input[type=range]{width:88px;accent-color:var(--accent)}
.tts-lab output{width:36px;text-align:right;color:var(--accent-ink);font-size:11px}
.tts-sel{
  max-width:200px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;outline:none;
  background:var(--card2);color:var(--ink);font-family:var(--sans);font-size:12px;
}
.tts-active{
  background:var(--hlbg)!important;border-radius:6px;box-shadow:0 0 0 3px var(--hlbg);
  transition:box-shadow .3s, background .3s;
}
#ttsToast{
  position:fixed;left:50%;bottom:76px;z-index:320;
  transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:12.5px;
  padding:9px 16px;border-radius:999px;box-shadow:var(--sh2);
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;max-width:86vw;text-align:center;
}
#ttsToast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:480px){
  #ttsCount{display:none}
}

/* ---------- paginatore ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;max-width:240mm;margin:26px auto 0;padding:0 4px}
.pager button{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  padding:12px 16px;border:1px solid var(--line);border-radius:12px;
  background:var(--paper);cursor:pointer;font-family:var(--sans);text-align:left;
  box-shadow:var(--sh1);
}
.pager button.next{align-items:flex-end;text-align:right}
.pager button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.pager button:disabled{opacity:.35;cursor:default}
.pg-lab{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pg-tit{font-size:12.5px;font-weight:700;color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- responsive ---------- */
@media (max-width:760px){
  .sheet{margin:0;border:none;border-radius:0;
    padding:calc(var(--my)*.42) clamp(18px,6vw,42px)}
  main.reader{padding:14px 0 100px}
  .brand span.long{display:none}
  .hero h1{font-size:2.3em}
  .pgnav-lab{display:none}
  .pgnav{padding:2px}
  .hdr-sep{display:none}
}
@media print{
  header.app,#drawer,#backdrop,#settings,.pager,#progress,#ttsBar,#ttsToast,.done-row{display:none!important}
  body{background:#fff}
  .sheet{box-shadow:none;border:none;max-width:none}
}
</style>
</head>
<body>

<div id="progress"></div>

<header class="app">
  <button class="ibtn" id="menuBtn" aria-label="Apri l'indice" title="Indice">&#9776;</button>
  <div class="brand"><em>PALESTRA</em> <span class="long">&middot; teoria dell&rsquo;allenamento</span></div>
  <div class="searchwrap">
    <svg class="sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
    <input type="search" id="searchBox" placeholder="Cerca nel documento…" autocomplete="off" aria-label="Cerca nel documento">
    <div id="results" role="listbox"></div>
  </div>
  <div class="pgnav" role="navigation" aria-label="Navigazione pagine">
    <button class="ibtn" id="tnPrev" aria-label="Pagina precedente" title="Pagina precedente">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 6 8.5 12 14.5 18"/></svg>
    </button>
    <span class="pgnav-lab" id="tnMid"></span>
    <button class="ibtn" id="tnNext" aria-label="Pagina successiva" title="Pagina successiva">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9.5 6 15.5 12 9.5 18"/></svg>

    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>

    <svg class="ico ico-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="7" y2="7"/><line x1="17" y1="17" x2="18.7" y2="18.7"/><line x1="5.3" y1="18.7" x2="7" y2="17"/><line x1="17" y1="7" x2="18.7" y2="5.3"/></svg>
  </button>
  <button class="ibtn" id="setBtn" aria-label="Parametri tipografici" title="Parametri tipografici">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4" fill="var(--paper)"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.4" fill="var(--paper)"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="7" cy="17" r="2.4" fill="var(--paper)"/></svg>
  </button>
</header>

<div id="settings" aria-label="Parametri tipografici">
  <h4>Parametri tipografici</h4>
  <p class="hint">Regola lo stile della pagina: le modifiche restano salvate su questo dispositivo.</p>
  <div class="set-row"><label>Dimensione testo</label><input type="range" id="setFs" min="8" max="14" step="0.5" value="10"><output id="outFs"></output></div>
  <div class="set-row"><label>Interlinea</label><input type="range" id="setLh" min="1.1" max="1.9" step="0.05" value="1.3"><output id="outLh"></output></div>
  <div class="set-row"><label>Margine laterale</label><input type="range" id="setMx" min="10" max="40" step="1" value="28"><output id="outMx"></output></div>
  <div class="set-row"><label>Margine alto/basso</label><input type="range" id="setMy" min="10" max="40" step="1" value="26"><output id="outMy"></output></div>
  <div class="set-row"><label>Spazio tra blocchi</label><input type="range" id="setGap" min="0.3" max="1.3" step="0.05" value="0.7"><output id="outGap"></output></div>
  <div class="set-row"><label>Spessore testo</label><input type="range" id="setFw" min="400" max="700" step="50" value="500"><output id="outFw"></output></div>

  <div class="set-foot" style="justify-content:flex-start;gap:8px;margin-top:2px">

    <input type="file" id="progFile" accept=".json,application/json" style="display:none" aria-label="File dei progressi">
  </div>
</div>

<div id="backdrop"></div>

<aside id="drawer" aria-label="Indice">
  <div class="dr-head">
    <strong>Indice</strong>
    <button class="ibtn" id="closeBtn" aria-label="Chiudi indice">&#10005;</button>
  </div>

<main class="reader">

  <nav class="pager">
    <button id="prevBtn"><span class="pg-lab">&larr; Precedente</span><span class="pg-tit" id="prevTit"></span></button>
    <button id="nextBtn" class="next"><span class="pg-lab">Successiva &rarr;</span><span class="pg-tit" id="nextTit"></span></button>
  </nav>
</main>

<div id="ttsBar" role="region" aria-label="Lettore vocale">
  <div class="tts-row">
    <button class="tbtn acc" id="ttsPlay" aria-label="Pausa / Riprendi" title="Pausa / Riprendi">
      <svg class="ico ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ico ico-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <div id="ttsProg" title="Vai a un punto della lettura"><div id="ttsFill"></div></div>
    <span id="ttsCount"></span>

      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>
    </button>

  <div class="tts-row tts-extra">

      <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>

      <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
    <label class="tts-lab">Velocit&agrave;
      <input type="range" id="ttsRate" min="0.5" max="2" step="0.05" value="1">
      <output id="ttsRateOut">1&times;</output>
    </label>
    <label class="tts-lab">Volume
      <input type="range" id="ttsVol" min="0" max="1" step="0.05" value="1">

  </div>
</div>

<div id="ttsToast" role="status"></div>

/* ---------- FIGURE SVG ---------- */

  <text x="330" y="110" text-anchor="middle">trasduzione</text>
  <text class="small" x="330" y="152" text-anchor="middle">segnali anabolici nella fibra</text>
  <rect class="nd nd-acc" x="490" y="60" width="150" height="72" rx="12"/>
  <text x="565" y="90" text-anchor="middle">Sintesi</text>
  <text x="565" y="110" text-anchor="middle">proteica netta</text>
  <text class="small" x="565" y="152" text-anchor="middle">&#8594; ipertrofia nel tempo</text>
  <line class="fl fg" x1="172" y1="96" x2="250" y2="96" marker-end="url(#pwA)"/>

</svg>`;

const FIG_ADATT = `
<svg viewBox="0 0 660 230" role="img" aria-label="Adattamenti neurali rapidi e ipertrofia progressiva nel tempo">
  <defs><marker id="pwB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-a" d="M0 0L10 5L0 10z"/></marker></defs>

      html: `
<p>Prima di programmare serve chiarire <strong>cosa dice al muscolo di crescere</strong>. La risposta della letteratura moderna converge su un punto: il segnale dominante è la <strong>tensione meccanica</strong>, la forza che le fibre devono generare e sopportare sotto carico. Non sono il dolore, non è il pompaggio, non è la fatica in sé: è la combinazione di carico, range e tempo sotto sforzo a fare da interruttore.</p>
<p>Alla base c'è la <span class="who" data-who="wackerhage">meccanotrasduzione</span>: le cellule muscolari convertono lo stimolo fisico in segnali chimici che regolano la sintesi proteica. Quando per ore dopo la seduta la sintesi supera la degradazione, il muscolo accumula proteine contrattili e cresce. Ogni decisione di programmazione — ripetizioni, pause, esercizi — vale nella misura in cui massimizza questa tensione <em>e la rende recuperabile</em>.</p>
<figure class="fig">${FIG_TENS}
<figcaption>Dal carico alla crescita: la tensione meccanica attiva i segnali anabolici; solo una sintesi proteica netta positiva, ripetuta nel tempo, produce ipertrofia.</figcaption>

<h3>Tre meccanismi candidati, un capofila</h3>
<p>I manuali citano tre motori dell'ipertrofia: tensione meccanica, stress metabolico e danno muscolare. Le evidenze più recenti ridimensionano gli ultimi due: lo stress metabolico accompagna spesso la crescita ma non ne è la causa necessaria, e il danno non predice l'adattamento (<span class="who" data-who="schoenfeld">Schoenfeld</span>, 2010; Plotkin et&nbsp;al., 2022). Resta la tensione: alta qualità di stimolo, ripetuta con sovraccarico progressivo.</p>
<div class="box">
  <div class="box-tag">Conseguenza pratica</div>
  <p>Ogni serie deve essere progettata intorno a due domande: <strong>quanta tensione genera</strong> sul muscolo bersaglio e <strong>a quale costo di fatica sistemica</strong>. Ciò che crea tensione senza recupero possibile, o che crea fatica senza tensione utile, è rumore di programmazione.</p>

<p class="lead">Sollevare pesi costruisce due cose diverse: un sistema nervoso più efficiente e un motore più grande. Confonderle costa anni.</p>
<p>Nelle prime settimane di un programma i guadagni di forza sono soprattutto <strong>neurali</strong>: migliore reclutamento delle unità motorie, frequenza di scarica più alta, coordinazione intramuscolare ed extramuscolare, minore inibizione protettiva (<span class="who" data-who="folland">Folland &amp; Williams</span>, 2007). Il muscolo non è ancora cresciuto molto: è diventato meglio comandato.</p>
<p>L'ipertrofia arriva più lenta e richiede volume ripetuto nel tempo. Ne segue una traiettoria tipica: all'inizio la forza sale quasi indipendentemente dalla massa; negli anni di allenamento, a parità di tecnica, <strong>la forza di un sollevatore riflette sempre più la sua sezione muscolare</strong>. Chi ha anni di pratica non può più contare sull'efficienza neurale per progredire: deve costruire tessuto.</p>

function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function stripHtml(h){
  var d = document.createElement("div");
  d.innerHTML = h;
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}
function escA(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildToc(){
  var h = '<div class="ch-group open">'
    + '<div class="ch-pages" style="display:block;padding:8px 8px 10px">'
    + '<a class="home-link" href="#/home" data-id="home"><span class="pg-no">&#9776;</span>Indice</a>'
    + '</div></div>';

    + '<button class="ch-head" type="button">'
    + '<div><div class="ch-num">Sottolineature</div><div class="ch-name" id="ulineCount"></div></div>'

      + '<span class="ch-comp"></span>'
      + '<span class="ch-arrow">&#9654;</span></button>'
      + '<div class="ch-pages">';

    });

    h += '</div></div>';

$("#tocNav").addEventListener("click", function(e){
  var head = e.target.closest(".ch-head");
  if(head){ head.parentElement.classList.toggle("open"); return; }
  var chk = e.target.closest(".toc-chk");
  if(chk){
    var la = chk.closest("a[data-id]");
    if(la){ setDone(la.getAttribute("data-id"), !isDone(la.getAttribute("data-id"))); }
    e.preventDefault();
    return;
  }
  var del = e.target.closest(".ul-del");
  if(del){
    var it = del.closest(".ul-item");
    removeUline(it.getAttribute("data-page"), parseInt(it.getAttribute("data-i"), 10));
    return;
  }
  var ui = e.target.closest(".ul-item");
  if(ui){
    jumpUline(ui.getAttribute("data-page"), parseInt(ui.getAttribute("data-i"), 10));
    closeDrawer();
    return;
  }
  var link = e.target.closest("a[data-id]");
  if(link){ closeDrawer(); }
});

    return '<tr><td style="white-space:nowrap"><strong>'+escA(r.k)+'</strong></td><td>'+escA(r.d)+'</td></tr>';

    + '<p class="fine">'+ch.title+' — riepilogo</p>';

function render(id){
  var i = FLAT.findIndex(function(p){ return p.id === id; });
  if(i < 0){ return render("home"); }
  curIdx = i;
  if(typeof ttsAbort === "function"){ ttsAbort(); }
  var it = FLAT[i];
  var body = $("#pageBody");
  clearHl();
  if(it.type === "home"){
    body.innerHTML = buildHome();
  } else if(it.type === "page"){
    var ch = BOOK[it.ch];
    var pg = ch.pages.find(function(p){ return p.id === id; });
    body.innerHTML = '<div class="kicker">'+ch.num+' &middot; '+ch.title+' &middot; Sezione '+it.no+'</div>'
      + '<h2 class="pt-title">'+pg.title+'</h2>' + pg.html
      + '<p class="fine">'+ch.title+' — sezione '+it.no+'</p>';
  } else if(it.type === "recap"){
    body.innerHTML = renderRecap(it);
  }
  updateTopnav();
  var prev = FLAT[i-1], next = FLAT[i+1];
  $("#prevBtn").disabled = !prev;
  $("#prevTit").textContent = prev ? prev.title : "";
  $("#nextBtn").disabled = !next;
  $("#nextTit").textContent = next ? next.title : "";
  $$("#tocNav a[data-id]").forEach(function(a){
    var active = a.getAttribute("data-id") === id;
    a.classList.toggle("active", active);
    if(active){
      var g = a.closest(".ch-group");
      if(g){ g.classList.add("open"); }
    }
  });
  refreshTocState();
  syncDoneUi();
  $("#progress").style.width = ((i+1)/FLAT.length*100)+"%";
  var label = "Indice";
  if(it.type === "page"){ label = it.no+" "+it.title; }
  else if(it.type === "recap"){ label = BOOK[it.ch].num+" \u00b7 Riepilogo"; }
  else if(it.type === "test"){ label = BOOK[it.ch].num+" \u00b7 Verifica"; }
  document.title = label+" \u00b7 Palestra";
  try{ localStorage.setItem("palestra_last", id); }catch(e){}
  window.scrollTo(0, 0);
  if(it.type === "page"){ applyUlines(id); }
  if(pendingJump && pendingJump.page === id && it.type === "page"){
    var ui = pendingJump.u; pendingJump = null;
    setTimeout(function(){
      var m = document.querySelector('#pageBody mark.uline[data-u="'+ui+'"]');
      if(m){
        m.classList.add("first");
        m.scrollIntoView({behavior:"smooth", block:"center"});
        setTimeout(function(){ m.classList.remove("first"); }, 1800);
      }
    }, 80);
  } else {
    pendingJump = null;
  }
  if(pendingHL && it.type === "page"){
    var tt = pendingHL; pendingHL = null;
    setTimeout(function(){ applyHL(tt); }, 50);
  } else {
    pendingHL = null;
  }
}

function navigate(id){
  if(parseHash() === id){ render(id); }
  else { location.hash = "#/"+id; }
}

function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  if(!h){ return "home"; }
  return FLAT.some(function(p){ return p.id === h; }) ? h : "home";
}

$("#pageBody").addEventListener("click", function(e){
  var go = e.target.closest("[data-go]");
  if(go){ navigate(go.getAttribute("data-go")); }
});

var SEARCH = null;
var searchTimer = null;

function getSearch(){
  if(SEARCH){ return SEARCH; }
  SEARCH = FLAT.map(function(f){
    var txt = "", kick = "";
    if(f.type === "page"){
      var pg = BOOK[f.ch].pages.find(function(x){ return x.id === f.id; });
      txt = stripHtml(pg.html);
      kick = BOOK[f.ch].num + " \u00b7 " + f.no;
    } else if(f.type === "home"){
      kick = "Documento";
      txt = "indice palestra allenamento ipertrofia forza volume rir sottolineature";
    } else if(f.type === "recap"){
      kick = BOOK[f.ch].num + " \u00b7 riepilogo";
      txt = stripHtml(RECAPS[f.ch].map(function(r){ return r.k + " " + r.d; }).join(" "));
    }
    return {id: f.id, kick: kick, tit: f.title, text: (f.title+" "+txt).toLowerCase()};
  });
  return SEARCH;
}

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function runSearch(){
  var q = $("#searchBox").value.trim().toLowerCase();
  var box = $("#results");
  if(q.length < 2){ box.classList.remove("on"); box.innerHTML = ""; return; }
  var items = getSearch().filter(function(s){ return s.text.indexOf(q) !== -1; }).slice(0, 12);
  var rx = new RegExp(escapeRe(escapeHtml(q)), "gi");
  if(!items.length){
    box.innerHTML = '<div class="sr-empty">Nessun risultato per \u00ab'+escapeHtml(q)+'\u00bb</div>';
  } else {
    box.innerHTML = items.map(function(s){
      var plain = (s.tit + ". " + s.text).toLowerCase();
      var idx = plain.indexOf(q);
      var start = Math.max(0, idx - 40);
      var snipRaw = (start > 0 ? "\u2026" : "") + plain.slice(start, idx + 80);
      var snip = escapeHtml(snipRaw).replace(rx, function(m){ return "<b>"+m+"</b>"; });
      return '<div class="sr-item" data-id="'+s.id+'">'
        + '<div class="sr-kick">'+escapeHtml(s.kick)+'</div>'
        + '<div class="sr-tit">'+escapeHtml(s.tit)+'</div>'
        + '<div class="sr-snip">'+snip+'</div></div>';
    }).join("");
  }
  box.classList.add("on");
}

$("#searchBox").addEventListener("input", function(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 180);
});
$("#searchBox").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    var first = $("#results .sr-item");
    if(first){ pickResult(first); }
  } else if(e.key === "Escape"){
    $("#results").classList.remove("on");
    e.target.blur();
  }
});
document.addEventListener("click", function(e){
  if(!e.target.closest(".searchwrap")){ $("#results").classList.remove("on"); }
});

function pickResult(item){
  var id = item.getAttribute("data-id");
  var q = $("#searchBox").value.trim();
  $("#results").classList.remove("on");
  $("#searchBox").blur();
  pendingHL = q.length >= 2 ? q : null;
  navigate(id);
}

$("#results").addEventListener("click", function(e){
  var item = e.target.closest(".sr-item");
  if(item){ pickResult(item); }
});

function clearHl(){
  $$("#pageBody mark.hl").forEach(function(m){
    m.replaceWith(document.createTextNode(m.textContent));
  });
}

function applyHL(term){
  clearHl();
  if(!term){ return; }
  var rx = new RegExp(escapeRe(term), "gi");
  var root = $("#pageBody");
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      var p = n.parentNode.nodeName;
      return (p === "SCRIPT" || p === "STYLE" || p === "MARK") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = [], n;
  while((n = walker.nextNode())){ nodes.push(n); }
  var first = null;
  nodes.forEach(function(node){
    var s = node.nodeValue;
    rx.lastIndex = 0;
    if(!rx.test(s)){ return; }
    rx.lastIndex = 0;
    var frag = document.createDocumentFragment(), last = 0, m;
    while((m = rx.exec(s))){
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      var mk = document.createElement("mark");
      mk.className = "hl";
      mk.textContent = m[0];
      frag.appendChild(mk);
      if(!first){ first = mk; }
      last = m.index + m[0].length;
      if(!m[0]){ break; }
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    node.replaceWith(frag);
  });
  if(first){
    setTimeout(function(){ first.scrollIntoView({behavior:"smooth", block:"center"}); }, 80);
  }
}

/* =====================================================================
   SOTTOLINEATURE
   ===================================================================== */

function loadUlines(){
  try{ return JSON.parse(localStorage.getItem("palestra_ulines")) || {}; }catch(e){ return {}; }
}
function saveUlines(u){
  try{ localStorage.setItem("palestra_ulines", JSON.stringify(u)); }catch(e){}
}

function textWalker(root){
  return document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      var p = n.parentNode.nodeName;
      return (p === "SCRIPT" || p === "STYLE" || p === "MARK") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
}

function pageTextMap(){
  var w = textWalker($("#pageBody"));
  var nodes = [], n, pos = 0, text = "";
  while((n = w.nextNode())){
    nodes.push({node:n, start:pos});
    pos += n.nodeValue.length;
    text += n.nodeValue;
  }
  return {nodes:nodes, text:text};
}

function wrapOffset(map, s, e, u){
  var ok = false;
  map.nodes.forEach(function(rec){
    if(!rec.node.parentNode){ return; }
    var ns = rec.start, ne = ns + rec.node.nodeValue.length;
    var a = Math.max(s, ns), b = Math.min(e, ne);
    if(b <= a){ return; }
    var txt = rec.node.nodeValue, st = a - ns, en = b - ns;
    if(!txt.slice(st, en).trim()){ return; }
    var mk = document.createElement("mark");
    mk.className = "uline";
    mk.textContent = txt.slice(st, en);
    mk.setAttribute("data-u", u);
    var frag = document.createDocumentFragment();
    if(st > 0){ frag.appendChild(document.createTextNode(txt.slice(0, st))); }
    frag.appendChild(mk);
    if(en < txt.length){ frag.appendChild(document.createTextNode(txt.slice(en))); }
    rec.node.parentNode.replaceChild(frag, rec.node);
    rec.node = null;
    ok = true;
  });
  return ok;
}

function applyUlines(pid){
  $$("#pageBody mark.uline").forEach(function(m){
    m.replaceWith(document.createTextNode(m.textContent));
  });
  var arr = loadUlines()[pid] || [];
  if(!arr.length){ return; }
  var map = pageTextMap();
  arr.forEach(function(en, i){
    if(typeof en.s !== "number"){
      // formato vecchio (solo testo): tiene solo la prima occorrenza
      en.s = map.text.indexOf(en.t);
      en.e = en.s < 0 ? -1 : en.s + en.t.length;
    }
    if(en.s >= 0 && en.e > en.s){ wrapOffset(map, en.s, en.e, i); }
  });
}

function removeUline(pid, i){
  var u = loadUlines();
  if(!u[pid]){ return; }
  u[pid].splice(i, 1);
  if(!u[pid].length){ delete u[pid]; }
  saveUlines(u);
  rebuildUlineList();
  var cur = FLAT[curIdx];
  if(cur && cur.id === pid && cur.type === "page"){ render(pid); }
}

function jumpUline(pid, i){
  var u = loadUlines();
  var e = (u[pid] || [])[i];
  if(!e){ return; }
  pendingJump = {page: pid, u: i};
  navigate(pid);
}

function rebuildUlineList(){
  var u = loadUlines();
  var html = "", count = 0;
  Object.keys(u).forEach(function(pid){
    var f = FLAT.find(function(p){ return p.id === pid; });
    if(!f){ return; }
    u[pid].forEach(function(e, i){
      count++;
      var lab = f.type === "page" ? (f.no + " " + f.title) : f.title;
      html += '<div class="ul-item" data-page="'+pid+'" data-i="'+i+'">'
        + '<span class="ul-txt">'+escapeHtml(e.t.length > 46 ? e.t.slice(0, 46)+"\u2026" : e.t)+'</span>'
        + '<span class="ul-page">'+escapeHtml(lab)+'</span>'
        + '<button class="ul-del" type="button" aria-label="Rimuovi sottolineatura">&#10005;</button></div>';
    });
  });
  if(!count){
    html = '<div class="ul-empty">Seleziona un passaggio nel testo: si evidenzia da solo e lo ritrovi qui, con salto diretto. Clicca su un brano evidenziato per rimuoverlo.</div>';
  }
  $("#ulineList").innerHTML = html;
  $("#ulineCount").textContent = count ? (count + (count === 1 ? " brano" : " brani")) : "Nessun brano";
}

function tryAutoUline(){
  var s = window.getSelection();
  if(!s || s.isCollapsed || !s.rangeCount){ return; }
  var body = $("#pageBody");
  if(!s.anchorNode || !s.focusNode || !body.contains(s.anchorNode) || !body.contains(s.focusNode)){ return; }
  var r = s.getRangeAt(0);
  var map = pageTextMap();
  function offOf(node, off, atStart){
    if(node.nodeType === 3){
      for(var i = 0; i < map.nodes.length; i++){
        if(map.nodes[i].node === node){ return map.nodes[i].start + off; }
      }
      return -1;
    }
    var host = node.nodeType === 1 ? node : node.parentNode;
    var w2 = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, null);
    var tn = atStart ? w2.firstChild() : w2.lastChild();
    if(!tn){ return -1; }
    for(var j = 0; j < map.nodes.length; j++){
      if(map.nodes[j].node === tn){ return map.nodes[j].start + (atStart ? 0 : tn.nodeValue.length); }
    }
    return -1;
  }
  var st = offOf(r.startContainer, r.startOffset, true);
  var en = offOf(r.endContainer, r.endOffset, false);
  if(st < 0 || en <= st){ return; }
  var raw = map.text.slice(st, en);
  st += raw.length - raw.replace(/^\s+/, "").length;
  en -= raw.length - raw.replace(/\s+$/, "").length;
  if(en - st < 3 || en - st > 4000){ return; }
  var pid = FLAT[curIdx].id;
  var u = loadUlines();
  u[pid] = u[pid] || [];
  if(u[pid].some(function(x){ return x.s === st && x.e === en; })){ return; }
  u[pid].push({t: map.text.slice(st, en).replace(/\s+/g, " ").trim(), s: st, e: en});
  saveUlines(u);
  applyUlines(pid);
  rebuildUlineList();
  s.removeAllRanges();
}
document.addEventListener("mouseup", function(){ setTimeout(tryAutoUline, 10); });
document.addEventListener("touchend", function(){ setTimeout(tryAutoUline, 60); });

document.addEventListener("click", function(e){
  var m = e.target.closest("mark.uline");
  if(!m){ return; }
  var cur = FLAT[curIdx];
  if(!cur || cur.type !== "page"){ return; }

  if(!u[pid].length){ delete u[pid]; }
  saveUlines(u);
  applyUlines(pid);
  rebuildUlineList();
});

  });

    var items = FLAT.filter(function(f){ return f.ch === ci; });
    var d = items.filter(function(f){ return doneIds.indexOf(f.id) !== -1; }).length;
    var c = g.querySelector(".ch-comp");

   ===================================================================== */

var PROG_PREFIX = "palestra_";
var PROG_NAME = "palestra";

function progCollect(){
  var out = {};
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(PROG_PREFIX) === 0){ out[k] = localStorage.getItem(k); }
    }
  }catch(e){}
  return out;
}

function progDownload(){
  var data = progCollect();
  var n = Object.keys(data).length;
  if(!n){ ttsToast("Non c\u2019 ancora nulla da esportare: sottolinea un passaggio o regola la tipografia."); return; }
  try{
    var payload = { app: PROG_NAME, version: 1, date: new Date().toISOString(), data: data };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    var pad = function(x){ return (x < 10 ? "0" : "") + x; };
    a.href = url;
    a.download = PROG_NAME + "_progresso_" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 800);
    ttsToast("Progressi esportati (" + n + (n === 1 ? " voce" : " voci") + ").");
  }catch(e){
    ttsToast("Esportazione non riuscita in questo browser.");
  }
}

function progApply(file){
  var r = new FileReader();
  r.onload = function(){
    var obj = null;
    try{ obj = JSON.parse(r.result); }catch(e){}
    if(!obj || typeof obj !== "object" || !obj.data || typeof obj.data !== "object"){
      ttsToast("File non valido: serve un file esportato da questo documento.");
      return;
    }
    var n = 0;
    try{
      Object.keys(obj.data).forEach(function(k){
        if(k.indexOf(PROG_PREFIX) === 0 && typeof obj.data[k] === "string"){
          localStorage.setItem(k, obj.data[k]);
          n++;
        }
      });
    }catch(e){}
    if(n){
      ttsToast("Progressi importati (" + n + (n === 1 ? " voce" : " voci") + "): ricarico la pagina.");
      setTimeout(function(){ location.reload(); }, 1000);
    } else {
      ttsToast("Nel file non ci sono voci compatibili con questo documento.");
    }
  };
  r.readAsText(file);
}

$("#progExport").addEventListener("click", progDownload);
$("#progImport").addEventListener("click", function(){ $("#progFile").click(); });
$("#progFile").addEventListener("change", function(){
  if(this.files && this.files[0]){ progApply(this.files[0]); }
  this.value = "";
});

/* ---------- utilità testo ---------- */

function ttsClean(s){ return String(s).replace(/\s+/g, " ").trim(); }

function ttsCap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function ttsPick(arr){
  var i;
  if(arr.length > 1){ do{ i = Math.floor(Math.random()*arr.length); }while(i === T.lastPick); }
  else { i = 0; }
  T.lastPick = i;
  return arr[i];
}

var _U = ["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci",
  "undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
var _D = ["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];

function ttsNumIt(n){
  n = parseInt(n, 10);
  if(isNaN(n)){ return ""; }
  if(n < 0){ return "meno " + ttsNumIt(-n); }
  if(n < 20){ return _U[n]; }
  if(n < 100){
    var d = Math.floor(n/10), u = n%10, w = _D[d];
    if(u === 1 || u === 8){ w = w.slice(0, -1); }
    return w + (u ? _U[u] : "");
  }
  if(n < 200){ return "cento" + (n%100 ? ttsNumIt(n%100) : ""); }
  if(n < 1000){ return _U[Math.floor(n/100)] + "cento" + (n%100 ? ttsNumIt(n%100) : ""); }
  return String(n);
}

function ttsPct(s){ return String(s).replace(/%/g, " per cento"); }

/* verbalizzazione best-effort delle equazioni */
function ttsEq(raw){
  var s = ttsClean(raw);
  s = s.replace(/[\u00b2\u00b3\u2070-\u2079\u207b\u00b9]+/g, function(run){
    var m = {"\u00b2":"2","\u00b3":"3","\u2070":"0","\u00b9":"1","\u2074":"4","\u2075":"5",
             "\u2076":"6","\u2077":"7","\u2078":"8","\u2079":"9","\u207b":"-"};
    var out = "";
    for(var i = 0; i < run.length; i++){ out += (m[run[i]] !== undefined ? m[run[i]] : ""); }
    return "^" + out;
  });
  s = s.replace(/[\u2080-\u2089]+/g, function(run){
    var base = 0x2080, out = "";
    for(var i = 0; i < run.length; i++){ out += String.fromCharCode(run.charCodeAt(i) - base + 48); }
    return "_" + out;
  });
  s = s.replace(/\u00bd/g, " un mezzo ");
  s = s.replace(/[\u00d7\u00b7]/g, " per ");
  s = s.replace(/=/g, " uguale a ");
  s = s.replace(/\+/g, " pi\u00f9 ");
  s = s.replace(/(\s)[\u2212\u2013-](\s)/g, "$1meno$2");
  s = s.replace(/\u2192/g, " danno ");
  s = s.replace(/\u2248/g, " circa ");
  s = s.replace(/%/g, " per cento");
  s = s.replace(/([A-Z])(?=[A-Z])/g, "$1 ");
  s = s.replace(/([A-Za-z])_([0-9]+)/g, function(_, a, num){ return a + " " + ttsNumIt(num) + " "; });
  s = s.replace(/([A-Za-z])_([A-Za-z])/g, "$1 $2");
  s = s.replace(/([A-Za-z])\^2(?![0-9])/g, "$1 al quadrato");
  s = s.replace(/([A-Za-z])\^3(?![0-9])/g, "$1 al cubo");
  s = s.replace(/([A-Za-z])\^-(\d+)/g, function(_, a, num){ return a + " elevato meno " + ttsNumIt(num); });
  s = s.replace(/([A-Za-z])\^(\d+)/g, function(_, a, num){ return a + " elevato " + ttsNumIt(num); });
  s = s.replace(/10\^(\d+)/g, function(_, num){ return " dieci elevato " + ttsNumIt(num); });
  s = s.replace(/\^-(\d+)/g, function(_, num){ return " elevato meno " + ttsNumIt(num); });
  s = s.replace(/\^(\d+)/g, function(_, num){ return " elevato " + ttsNumIt(num); });
  return ttsClean(s);
}

/* ---------- costruzione del copione ---------- */

function ttsPush(out, t, el){
  t = ttsClean(t);
  if(t && el){ out.push({t: t, el: el}); }
}

function ttsOpenLine(){
  var body = $("#pageBody");
  var kick = body.querySelector(".kicker");
  var tit = body.querySelector("h2.pt-title");
  var k = kick ? ttsClean(kick.textContent) : "";
  var t = tit ? ttsClean(tit.textContent) : "";
  var sep = k.indexOf("\u00b7");
  if(sep !== -1){
    var left = k.slice(0, sep).trim();
    var right = k.slice(sep + 1).trim();
    right = right.charAt(0).toLowerCase() + right.slice(1);
    if(right === "riepilogo"){ return left + ", riepilogo del capitolo."; }
    return left + ", " + right + ": " + t + ".";
  }
  return (k ? k + ": " : "") + t + ".";
}

function ttsNarrateBox(box, out, withTag){
  var tag = box.querySelector(".box-tag");
  if(tag && withTag){ ttsPush(out, ttsClean(tag.textContent) + ".", box); }
  for(var i = 0; i < box.children.length; i++){
    var c = box.children[i];
    if(c.classList.contains("box-tag")){ continue; }
    ttsNarrate(c, out);
  }
}

function ttsNarrateTable(tbl, out){
  ttsPush(out, ttsPick(INTRO_TABLE), tbl);
  for(var i = 0; i < tbl.rows.length; i++){
    var cells = tbl.rows[i].cells, j, isHead = true;
    for(j = 0; j < cells.length; j++){ if(cells[j].tagName !== "TH"){ isHead = false; break; } }
    var parts = [];
    for(j = 0; j < cells.length; j++){ parts.push(ttsClean(cells[j].textContent)); }
    if(isHead){
      ttsPush(out, "Le colonne: " + parts.filter(Boolean).join(", ") + ".", tbl.rows[i]);
    } else {
      var lab = parts.shift();
      ttsPush(out, (lab ? lab + ": " : "") + parts.join("; "), tbl.rows[i]);
    }
  }
}

function ttsNarrateSvolg(el, out){
  ttsPush(out, ttsPick(INTRO_EX), el);
  var t = el.querySelector(".sv-title");
  if(t){ ttsPush(out, ttsClean(t.textContent) + ".", t); }
  var tr = el.querySelector(".sv-traccia");
  if(tr){
    var tx = ttsClean(tr.textContent).replace(/^Traccia\s*[\u2014\u2013-]\s*/i, "");
    ttsPush(out, "Traccia: " + tx, tr);
  }
  var steps = el.querySelectorAll("ol.hand > li");
  for(var i = 0; i < steps.length; i++){
    ttsPush(out, "Passo " + (i+1) + ": " + ttsClean(steps[i].textContent), steps[i]);
  }
  var r = el.querySelector(".ris");
  if(r){ ttsPush(out, "E il risultato: " + ttsClean(r.textContent), r); }
}

function ttsNarrate(el, out){
  var cls = el.classList, tag = el.tagName, i, kids;
  if(cls.contains("kicker") || cls.contains("pt-title") || cls.contains("fine")){ return; }
  if(tag === "H3"){ ttsPush(out, ttsClean(el.textContent) + ".", el); return; }
  if(tag === "P"){ ttsPush(out, ttsClean(el.textContent), el); return; }
  if(tag === "TABLE"){ ttsNarrateTable(el, out); return; }
  if(cls.contains("checkin")){ ttsPush(out, ttsPick(SKIP_CHECK), el); return; }
  if(cls.contains("exblock")){ ttsPush(out, ttsPick(SKIP_EX), el); return; }
  if(cls.contains("box")){ ttsNarrateBox(el, out, true); return; }
  if(cls.contains("cols2")){
    ttsPush(out, ttsPick(INTRO_COMPARE), el);
    kids = el.querySelectorAll(".box");
    for(i = 0; i < kids.length; i++){ ttsNarrateBox(kids[i], out, true); }
    return;
  }
  if(cls.contains("timeline")){
    kids = el.querySelectorAll(":scope > li");
    for(i = 0; i < kids.length; i++){
      var li = kids[i], lead = "";
      var yv = "";
      var cl = li.cloneNode(true);
      var yy = cl.querySelector(".tl-y");
      if(yy){
        yv = ttsClean(yy.textContent);
        lead = /^\d+$/.test(yv) ? "Nel " + yv + "," : yv + ",";
        yy.parentNode.removeChild(yy);
      }
      ttsPush(out, (lead ? lead + " " : "") + ttsClean(cl.textContent), li);
    }
    return;
  }
  if(cls.contains("steps")){
    kids = el.querySelectorAll(":scope > li");
    for(i = 0; i < kids.length; i++){
      var o = i < ORD_IT.length ? ORD_IT[i] : "punto " + (i+1);
      ttsPush(out, ttsCap(o) + " punto: " + ttsClean(kids[i].textContent), kids[i]);
    }
    return;
  }
  if(cls.contains("dots")){
    kids = el.querySelectorAll("li");
    for(i = 0; i < kids.length; i++){ ttsPush(out, ttsClean(kids[i].textContent), kids[i]); }
    return;
  }
  if(cls.contains("bars")){
    ttsPush(out, ttsPick(INTRO_BARS), el);
    kids = el.querySelectorAll(".bar-row");
    for(i = 0; i < kids.length; i++){
      var l = kids[i].querySelector(".lbl"), v = kids[i].querySelector(".val");
      if(l && v){ ttsPush(out, ttsClean(l.textContent) + ": " + ttsPct(ttsClean(v.textContent)), kids[i]); }
    }
    return;
  }
  if(cls.contains("eq")){ ttsPush(out, ttsEq(el.textContent), el); return; }
  if(tag === "FIGURE"){
    var cap = el.querySelector("figcaption");
    ttsPush(out, ttsPick(INTRO_FIG) + " " + (cap ? ttsClean(cap.textContent) : ""), el);
    return;
  }
  if(cls.contains("svolg")){ ttsNarrateSvolg(el, out); return; }
  for(i = 0; i < el.children.length; i++){ ttsNarrate(el.children[i], out); }
}

function ttsBuildSegments(){
  var body = $("#pageBody");
  var out = [];
  var op = ttsOpenLine();
  if(op){ ttsPush(out, op, body.querySelector(".kicker") || body); }
  for(var i = 0; i < body.children.length; i++){ ttsNarrate(body.children[i], out); }
  return out;
}

/* ---------- coda e motore ---------- */

function ttsSplit(t, max){
  var res = [], buf = "", i;
  for(i = 0; i < t.length; i++){
    buf += t[i];
    var L = buf.length;
    if(L >= 40 && /[.!?:;]$/.test(buf) && t[i+1] === " "){ res.push(buf.trim()); buf = ""; }
    else if(L >= max && t[i] === " "){ res.push(buf.trim()); buf = ""; }
    else if(L >= max + 60){ res.push(buf.trim()); buf = ""; }
  }
  if(buf.trim()){ res.push(buf.trim()); }
  return res;
}

function ttsGetVoice(){
  if(!synth || !T.voiceURI){ return null; }
  var vs = synth.getVoices();
  for(var i = 0; i < vs.length; i++){ if(vs[i].voiceURI === T.voiceURI){ return vs[i]; } }
  return null;
}

function ttsScoreVoice(v){
  var s = 0;
  if(/natural/i.test(v.name)){ s += 4; }
  if(/online/i.test(v.name)){ s += 1; }
  if(v.lang.toLowerCase() === "it-it"){ s += 2; }
  return s;
}

function ttsRefreshVoices(){
  if(!synth){ return; }
  var sel = $("#ttsVoice");
  var vs = synth.getVoices().filter(function(v){ return /^it/i.test(v.lang); });
  vs.sort(function(a, b){ return ttsScoreVoice(b) - ttsScoreVoice(a); });
  sel.innerHTML = "";
  if(!vs.length){
    var opt = document.createElement("option");
    opt.textContent = "Nessuna voce italiana";
    opt.value = "";
    sel.appendChild(opt);
    sel.disabled = true;
    T.voiceURI = "";
    return;
  }
  sel.disabled = false;
  vs.forEach(function(v){
    var o = document.createElement("option");
    o.value = v.voiceURI;
    o.textContent = v.name.replace(/^Microsoft\s+/i, "").replace(/\s*-\s*Italian.*$/i, "") || v.name;
    sel.appendChild(o);
  });
  var savedOk = vs.some(function(v){ return v.voiceURI === T.voiceURI; });
  if(!savedOk){ T.voiceURI = vs[0].voiceURI; }
  sel.value = T.voiceURI;
  ttsSavePrefs();
}

function ttsHighlight(el){
  ttsClearHL();
  if(!el){ return; }
  T.hl = el;
  el.classList.add("tts-active");
  el.scrollIntoView({behavior: "smooth", block: "center"});
}

function ttsClearHL(){
  if(T.hl){ T.hl.classList.remove("tts-active"); T.hl = null; }
}

function ttsSetIcon(){
  $("#ttsPlay").classList.toggle("playing", T.playing && !T.paused);
}

function ttsProgress(qi){
  var ch = T.q[qi];
  if(!ch){ return; }
  $("#ttsFill").style.width = ((qi+1) / T.q.length * 100) + "%";
  $("#ttsCount").textContent = (ch.si+1) + "/" + T.segs.length;
}

function ttsFinish(){
  T.playing = false;
  T.paused = false;
  ttsSetIcon();
  ttsClearHL();
  $("#ttsFill").style.width = "100%";
  $("#ttsCount").textContent = "fine";
}

function ttsSpeakFrom(qi){
  if(!synth){ return; }
  if(qi < 0){ qi = 0; }
  if(qi >= T.q.length){ ttsFinish(); return; }
  synth.cancel();
  T.qi = qi;
  var ch = T.q[qi], seg = T.segs[ch.si];
  var u = new SpeechSynthesisUtterance(ch.t);
  T.u = u;
  var v = ttsGetVoice();
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = "it-IT"; }
  u.rate = T.rate;
  u.volume = T.vol;
  u.pitch = 1;
  var tok = ++T.token;
  u.onstart = function(){
    if(tok !== T.token){ return; }
    if(ch.si !== T.lastHl){
      T.lastHl = ch.si;
      ttsHighlight(seg.el);
    }
    ttsProgress(qi);
  };
  u.onend = function(){
    if(tok !== T.token || T.paused){ return; }
    ttsSpeakFrom(qi + 1);
  };
  u.onerror = function(ev){
    if(tok !== T.token){ return; }
    if(ev && (ev.error === "interrupted" || ev.error === "canceled")){ return; }
    ttsSpeakFrom(qi + 1);
  };
  setTimeout(function(){
    if(tok === T.token){ try{ synth.speak(u); }catch(e){} }
  }, 50);
}

function ttsStartSession(){
  if(!synth){
    ttsToast("La sintesi vocale non \u00e8 disponibile in questo browser.");
    return;
  }
  var f = FLAT[curIdx];
  if(f.type !== "page" && f.type !== "recap"){
    ttsToast("Questa pagina non contiene testo da leggere.");
    return;
  }
  var segs = ttsBuildSegments();
  if(!segs.length){
    ttsToast("Nessun testo trovato su questa pagina.");
    return;
  }
  T.segs = segs;
  T.q = [];
  segs.forEach(function(s, si){
    ttsSplit(s.t, 180).forEach(function(c){ T.q.push({t: c, si: si}); });
  });
  T.lastHl = -1;
  T.playing = true;
  T.paused = false;
  $("#ttsBar").classList.add("on");
  ttsSetIcon();
  ttsSpeakFrom(0);
}

function ttsPause(){
  if(!T.playing || T.paused){ return; }
  T.paused = true;
  try{ synth.pause(); }catch(e){}
  ttsSetIcon();
}

function ttsResume(){
  if(!T.playing || !T.paused){ return; }
  T.paused = false;
  try{ synth.resume(); }catch(e){}
  ttsSetIcon();
}

function ttsAbort(){
  if(!synth){ return; }
  T.token++;
  try{ synth.cancel(); }catch(e){}
  T.playing = false;
  T.paused = false;
  ttsClearHL();
  ttsSetIcon();
}

function ttsJumpToSeg(si){
  si = Math.max(0, Math.min(si, T.segs.length - 1));
  var target = 0;
  for(var i = 0; i < T.q.length; i++){
    if(T.q[i].si === si){ target = i; break; }
  }
  T.paused = false;
  T.playing = true;
  ttsSetIcon();
  ttsSpeakFrom(target);
}

var TOAST_TIMER = null;
function ttsToast(msg){
  var el = $("#ttsToast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(function(){ el.classList.remove("on"); }, 3200);
}

/* ---------- preferenze ---------- */

function ttsLoadPrefs(){
  var p = null;
  try{ p = JSON.parse(localStorage.getItem("palestra_tts")); }catch(e){}
  if(p){
    if(typeof p.rate === "number"){ T.rate = Math.min(2, Math.max(0.5, p.rate)); }
    if(typeof p.vol === "number"){ T.vol = Math.min(1, Math.max(0, p.vol)); }
    if(typeof p.voiceURI === "string"){ T.voiceURI = p.voiceURI; }
  }
  $("#ttsRate").value = T.rate;
  $("#ttsVol").value = T.vol;
  $("#ttsRateOut").textContent = T.rate.toFixed(2).replace(/\.?0+$/, "").replace(".", ",") + "\u00d7";
}

function ttsSavePrefs(){
  try{
    localStorage.setItem("palestra_tts", JSON.stringify({rate: T.rate, vol: T.vol, voiceURI: T.voiceURI}));
  }catch(e){}
}

/* ---------- eventi ---------- */

$("#ttsBtn").addEventListener("click", function(){
  if(T.playing && !T.paused){ ttsPause(); }
  else if(T.playing && T.paused){ ttsResume(); }
  else { ttsStartSession(); }
});

$("#ttsPlay").addEventListener("click", function(){
  if(T.playing && !T.paused){ ttsPause(); }
  else if(T.playing && T.paused){ ttsResume(); }
  else { ttsStartSession(); }
});

$("#ttsStopBtn").addEventListener("click", function(){ ttsAbort(); });

$("#ttsPrev").addEventListener("click", function(){
  if(T.playing || T.paused){ ttsJumpToSeg(T.q[T.qi].si - 1); }
});

$("#ttsNext").addEventListener("click", function(){
  if(T.playing || T.paused){ ttsJumpToSeg(T.q[T.qi].si + 1); }
});

$("#ttsProg").addEventListener("click", function(e){
  if(!T.segs.length){ return; }
  var r = this.getBoundingClientRect();
  var frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  ttsJumpToSeg(Math.floor(frac * T.segs.length));
});

$("#ttsMin").addEventListener("click", function(){
  $("#ttsBar").classList.toggle("open");
});

var RATE_TIMER = null;
$("#ttsRate").addEventListener("input", function(){
  T.rate = parseFloat(this.value) || 1;
  $("#ttsRateOut").textContent = T.rate.toFixed(2).replace(/\.?0+$/, "").replace(".", ",") + "\u00d7";
  clearTimeout(RATE_TIMER);
  RATE_TIMER = setTimeout(function(){
    ttsSavePrefs();
    if(T.playing && !T.paused){ ttsSpeakFrom(T.qi); }
  }, 350);
});

var VOL_TIMER = null;
$("#ttsVol").addEventListener("input", function(){
  T.vol = parseFloat(this.value);
  if(isNaN(T.vol)){ T.vol = 1; }
  clearTimeout(VOL_TIMER);
  VOL_TIMER = setTimeout(function(){
    ttsSavePrefs();
    if(T.playing && !T.paused){ ttsSpeakFrom(T.qi); }
  }, 350);
});

$("#ttsVoice").addEventListener("change", function(){
  T.voiceURI = this.value;
  ttsSavePrefs();
  if(T.playing && !T.paused){ ttsSpeakFrom(T.qi); }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && (T.playing || T.paused)){ ttsAbort(); }
});

window.addEventListener("beforeunload", function(){
  if(synth){ try{ synth.cancel(); }catch(e){} }
});

if(synth){
  if(typeof synth.onvoiceschanged !== "undefined"){
    synth.onvoiceschanged = ttsRefreshVoices;
  }
}

ttsLoadPrefs();
ttsRefreshVoices();

/* =====================================================================
   AVVIO
   ===================================================================== */

buildToc();
loadTypo();
rebuildUlineList();
refreshTocState();
syncDoneUi();

window.addEventListener("hashchange", function(){
  render(parseHash());
});

(function(){
  var start = parseHash();
  if(start === "home"){
    try{ start = localStorage.getItem("palestra_last") || "home"; }catch(e){}
    if(!FLAT.some(function(p){ return p.id === start; })){ start = "home"; }
  }
  render(start);
})();
</script>
